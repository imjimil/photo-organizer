<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='35%25'><stop offset='0%25' stop-color='%23c4b5fd'/><stop offset='50%25' stop-color='%236ee7b7'/><stop offset='100%25' stop-color='%23fda4af'/></radialGradient></defs><circle cx='50' cy='50' r='44' fill='url(%23g)'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9fc" />
    <script>
      (function () {
        var s = localStorage.getItem('opal-theme')
        var dark =
          s === 'dark' ||
          (s !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light',
        )
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name=theme-color]')
        if (meta)
          meta.content = dark ? '#1a1625' : '#faf9fc'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gloock&family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <title>Opal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
