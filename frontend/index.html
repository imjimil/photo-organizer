<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23d4a356'/><circle cx='50' cy='50' r='32' fill='%23221d18'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f3f6" />
    <script>
      (function () {
        var s = localStorage.getItem('opal-theme')
        var dark =
          s === 'dark' ||
          (s !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light',
        )
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name=theme-color]')
        if (meta) meta.content = dark ? '#221d18' : '#f1f3f6'
      })()
    </script>
    <title>Opal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
